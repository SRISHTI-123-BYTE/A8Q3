apiVersion: apps/v1
kind: Deployment
metadata:
  name: college-dept-portal
spec:
  replicas: 3
  selector:
    matchLabels:
      app: college-dept-portal
  template:
    metadata:
      labels:
        app: college-dept-portal
    spec:
      containers:
      - name: college-dept-portal
        image: hsri123/college-dept-portal:latest
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: college-dept-service
spec:
  type: NodePort
  selector:
    app: college-dept-portal
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30012